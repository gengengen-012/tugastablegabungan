<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabungan Tabel Nilai dan Tabel Desain</title>
    <link rel="stylesheet" href="table.css">
</head>
<body>
    <table>
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Mata Pelajaran</th>
            <th>Nilai</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Emillie</td>
            <td>IPS</td>
            <td>98</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Sophie</td>
            <td>B.Indo</td>
            <td>84</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Michelle</td>
            <td>IPA</td>
            <td>89</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Evie</td>
            <td>PPKn</td>
            <td>95</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Olin</td>
            <td>MTK</td>
            <td>46</td>
        </tr>
    </table>

    <h2>Tabel Rowspan & Colspan</h2>
    <table>
  
        <tr>
            <td rowspan="3">1</td>
            <td colspan="2">2</td>
            <td colspan="2">3</td>
            <td rowspan="4">4</td>
            <td rowspan="4">5</td>
            <td rowspan="2">6</td>
            <td rowspan="6">7</td>
        </tr>

        <tr>
            <td class="cyan">8</td>
            <td class="cyan">9</td>
            <td colspan="2" class="cyan">10</td>
        </tr>

        <tr>
            <td>11</td>
            <td>12</td>
            <td>13</td>
            <td>14</td>
            <td rowspan="3">15</td>
        </tr>

        <tr>
            <td colspan="5" class="cyan">16</td>
        </tr>

        <tr>
            <td rowspan="2">17</td>
            <td colspan="2">18</td>
            <td rowspan="2">19</td>
            <td colspan="3">20</td>
        </tr>

        <tr>
            <td class="cyan">21</td>
            <td class="cyan">22</td>
            <td colspan="4" class="cyan">23</td>
        </tr>
    </table>

</body>
</html>
